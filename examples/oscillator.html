<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Oscillator</title>
		<script src="./tone-ui.js"></script>
	</head>
	<body>
		<tone-example>
			<div slot="explanation">
				The oscillator has 4 basic types which can be altered by setting
				the number of partials and partials array.
				<br /><br />
				<a
					href="https://tonejs.github.io/docs/latest/classes/Oscillator"
					>Tone.Oscillator</a
				>
				docs.
			</div>

			<tone-momentary-button></tone-momentary-button>
		</tone-example>

		<script data-tone-code>
			const osc = new Tone.Oscillator({
				type: "square",
				frequency: 440,
				volume: -16,
			}).toDestination();
		</script>

		<script>
			ui(osc);
			bind("tone-momentary-button", osc);
		</script>
	</body>
</html>
