<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>MonoSynth</title>
		<script src="./js/tone-ui.js"></script>
	</head>
	<body>
		<tone-example>
			<div slot="explanation">
				<a href="https://tonejs.github.io/docs/latest/classes/MonoSynth"
					>Tone.MonoSynth</a
				>
				is composed of one oscillator, one filter, and two envelopes.
				Both envelopes are triggered simultaneously when a note is
				triggered.
			</div>
		</tone-example>

		<script data-tone-code>
			const synth = new Tone.PolySynth(Tone.MonoSynth, {
				volume: -8,
				oscillator: {
					type: "square8",
				},
				envelope: {
					attack: 0.05,
					decay: 0.3,
					sustain: 0.4,
					release: 0.8,
				},
				filterEnvelope: {
					attack: 0.001,
					decay: 0.7,
					sustain: 0.1,
					release: 0.8,
					baseFrequency: 300,
					octaves: 4,
				},
			}).toDestination();
		</script>

		<script>
			piano(synth);
			ui(synth, { name: "MonoSynth" });
		</script>
	</body>
</html>
