<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Reverse Delay</title>

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="174x174"
			href="./favicon.png"
		/>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/webcomponentsjs/2.4.3/webcomponents-bundle.js"></script>
		<link
			href="https://fonts.googleapis.com/css?family=Material+Icons&display=block"
			rel="stylesheet"
		/>
		<script src="../build/Tone.js"></script>
		<script src="./js/tone-ui.js"></script>
		<script src="./js/components.js"></script>
	</head>
	<body>
		<tone-example label="Reverse Delay">
			<tone-loader></tone-loader>

			<div slot="explanation">
				
				<br /><br />
				<a
					href="https://tonejs.github.io/docs/latest/classes/ReverseDelay"
					>Tone.ReverseDelay</a
				>
				docs.
			</div>

			<div id="content">
			</div>
		</tone-example>

		<script type="text/javascript">
			// TODO:
			// Add adjustable controls
			// Figure out good settings
			// Add explanation
			const reverseDelay = new Tone.ReverseDelay({
				delayTime: .5,
				feedback: .5
			}).toDestination();

			const synth = new Tone.PolySynth(Tone.Synth, {
				oscillator: {
					partials: [0, 2, 3, 4],
				},
			}).connect(reverseDelay);

			piano({
				parent: document.querySelector("#content"),
				polyphonic: true,
				noteon: (note) => synth.triggerAttack(note.name),
				noteoff: (note) => synth.triggerRelease(note.name),
			});

			document
				.querySelector("tone-momentary-button")
				.addEventListener("down", () => player.start());
			document
				.querySelector("tone-momentary-button")
				.addEventListener("up", () => player.stop());;
		</script>
	</body>
</html>
