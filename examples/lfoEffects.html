<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>LFO Effects</title>
		<script src="./tone-ui.js"></script>
	</head>
	<body>
		<tone-example>
			<div slot="explanation">
				These effects use an
				<a href="https://tonejs.github.io/docs/latest/classes/LFO"
					>LFO</a
				>
				(Low Frequency Oscillator) to modulate the effect. Click and
				drag the dot to change the frequency and depth of the effect.
				<br /><br />
				Docs on
				<a
					href="https://tonejs.github.io/docs/latest/classes/AutoPanner"
					>Tone.AutoPanner</a
				>,
				<a
					href="https://tonejs.github.io/docs/latest/classes/AutoFilter"
					>Tone.AutoFilter</a
				>, and
				<a href="https://tonejs.github.io/docs/latest/classes/Tremolo"
					>Tone.Tremolo</a
				>
			</div>

			<tone-slider
				label="Panner"
				id="panner"
				units="hz"
				step="0.5"
				min="1"
				max="15"
			></tone-slider>
			<tone-play-toggle id="osc0"></tone-play-toggle>
			<tone-slider
				label="Filter"
				id="filter"
				units="hz"
				step="0.5"
				min="1"
				max="15"
			></tone-slider>
			<tone-play-toggle id="osc1"></tone-play-toggle>
			<tone-slider
				label="Tremolo"
				id="tremolo"
				units="hz"
				step="0.5"
				min="1"
				max="15"
			></tone-slider>
			<tone-play-toggle id="osc2"></tone-play-toggle>
		</tone-example>

		<script data-tone-code>
			// AutoPanner - a panning modulation effect
			const panner = new Tone.AutoPanner({
				frequency: 4,
				depth: 1,
			})
				.toDestination()
				.start();

			// AutoFilter - a filter modulation effect
			const filter = new Tone.AutoFilter({
				frequency: 2,
				depth: 0.6,
			})
				.toDestination()
				.start();

			// Tremolo - an amplitude modulation effect
			const tremolo = new Tone.Tremolo({
				frequency: 0.6,
				depth: 0.7,
			})
				.toDestination()
				.start();

			// the input oscillators
			const pannerOsc = new Tone.Oscillator({
				volume: -12,
				type: "square6",
				frequency: "C4",
			}).connect(panner);

			const filterOsc = new Tone.Oscillator({
				volume: -12,
				type: "square6",
				frequency: "E4",
			}).connect(filter);

			const tremoloOsc = new Tone.Oscillator({
				volume: -12,
				type: "square6",
				frequency: "A4",
			}).connect(tremolo);
		</script>

		<script>
			bind("#osc0", pannerOsc);
			bind("#panner", panner.frequency);
			bind("#osc1", filterOsc);
			bind("#filter", filter.frequency);
			bind("#osc2", tremoloOsc);
			bind("#tremolo", tremolo.frequency);
		</script>
	</body>
</html>
