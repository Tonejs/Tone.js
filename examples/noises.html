<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Noise</title>
		<script src="./tone-ui.js"></script>
	</head>
	<body>
		<tone-example>
			<div slot="explanation">
				<a href="https://tonejs.github.io/docs/latest/classes/Noise"
					>Tone.Noise</a
				>
				has 3 different types of noise. Careful, it's loud!
			</div>

			<tone-momentary-button></tone-momentary-button>
		</tone-example>

		<script data-tone-code>
			// make the noise and connect it to the output
			const noise = new Tone.Noise({
				volume: -10,
				type: "brown",
			}).toDestination();

			const toneWaveform = new Tone.Waveform();
			noise.connect(toneWaveform);
		</script>

		<script>
			waveform(toneWaveform);
			ui(noise);
			bind("tone-momentary-button", noise);
		</script>
	</body>
</html>
