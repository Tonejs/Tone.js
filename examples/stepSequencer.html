<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Step Sequencer</title>
		<script src="./tone-ui.js"></script>
	</head>
	<body>
		<tone-example>
			<div slot="explanation">
				<a
					href="https://tonejs.github.io/docs/latest/functions/getTransport.html"
					>Tone.Transport</a
				>
				is the application-wide timekeeper. Its clock source enables
				sample-accurate scheduling as well as tempo-curves and
				automation. This example uses Tone.Sequence to invoke a callback
				every 16th note.
			</div>

			<tone-play-toggle></tone-play-toggle>
			<tone-slider
				label="tempo"
				units="bpm"
				min="60"
				max="240"
			></tone-slider>
			<tone-step-sequencer></tone-step-sequencer>
		</tone-example>

		<script data-tone-code>
			const keys = new Tone.Players({
				urls: {
					0: "A1.mp3",
					1: "Cs2.mp3",
					2: "E2.mp3",
					3: "Fs2.mp3",
				},
				fadeOut: "64n",
				baseUrl: "https://tonejs.github.io/audio/casio/",
			}).toDestination();
		</script>

		<script>
			bind("tone-play-toggle", Tone.getTransport());
			bind("tone-slider", Tone.Transport.bpm);
			bind("tone-step-sequencer", (time, row) =>
				keys.player(String(row)).start(time, 0, "16t")
			);
		</script>
	</body>
</html>
