<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>AMSynth</title>
		<script src="./tone-ui.js"></script>
	</head>
	<body>
		<tone-example>
			<div slot="explanation">
				<a href="https://tonejs.github.io/docs/latest/classes/AMSynth"
					>Tone.AMSynth</a
				>
				is composed of two
				<a href="https://tonejs.github.io/docs/latest/classes/Synth"
					>Tone.Synths</a
				>
				where one Tone.Synth modulates the amplitude of a second
				Tone.Synth.
			</div>
		</tone-example>

		<script data-tone-code>
			const synth = new Tone.AMSynth({
				harmonicity: 2.5,
				oscillator: {
					type: "fatsawtooth",
				},
				envelope: {
					attack: 0.1,
					decay: 0.2,
					sustain: 0.2,
					release: 0.3,
				},
				modulation: {
					type: "square",
				},
				modulationEnvelope: {
					attack: 0.5,
					decay: 0.01,
				},
			}).toDestination();
		</script>

		<script>
			piano(synth);
			ui(synth);
		</script>
	</body>
</html>
