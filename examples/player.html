<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Player</title>
		<script src="./tone-ui.js"></script>
	</head>
	<body>
		<tone-example>
			<div slot="explanation">
				Click on the button to play the audio file on loop using
				<a href="https://tonejs.github.io/docs/latest/classes/Player"
					>Tone.Player</a
				>.
			</div>

			<tone-play-toggle></tone-play-toggle>
		</tone-example>

		<script data-tone-code>
			// the player
			const player = new Tone.Player({
				url: "https://tonejs.github.io/audio/loop/FWDL.mp3",
				loop: true,
				loopStart: 0.5,
				loopEnd: 0.7,
			}).toDestination();
		</script>

		<script>
			ui(player);
			bind("tone-play-toggle", player);
		</script>
	</body>
</html>
