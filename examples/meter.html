<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Meter</title>
		<script src="./js/tone-ui.js"></script>
	</head>
	<body>
		<tone-example>
			<div slot="explanation">
				<a
					href="https://tonejs.github.io/docs/latest/classes/Meter"
					target="_blank"
					>Tone.Meter</a
				>
				gives you the level of the incoming signal in decibels.
			</div>

			<tone-play-toggle></tone-play-toggle>
		</tone-example>

		<script data-tone-code>
			const player = new Tone.Player({
				url: "https://tonejs.github.io/audio/berklee/Resonant_FM_laser1.mp3",
				loop: true,
			}).toDestination();

			const toneMeter = new Tone.Meter({
				channelCount: 2,
			});
			player.connect(toneMeter);
		</script>

		<script>
			meter(toneMeter);
			ui(player);
			bind("tone-play-toggle", player);
		</script>
	</body>
</html>
