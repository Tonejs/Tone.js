<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Synth</title>
		<script src="./tone-ui.js"></script>
	</head>
	<body>
		<tone-example>
			<div slot="explanation">
				<a
					href="https://tonejs.github.io/docs/latest/classes/Synth"
					target="_blank"
					>Tone.Synth</a
				>
				is composed simply of a
				<a
					href="https://tonejs.github.io/docs/latest/classes/OmniOscillator"
					target="_blank"
					>Tone.OmniOscillator</a
				>
				routed through a
				<a
					href="https://tonejs.github.io/docs/latest/classes/AmplitudeEnvelope"
					target="_blank"
					>Tone.AmplitudeEnvelope</a
				>.
			</div>
		</tone-example>

		<script data-tone-code>
			const synth = new Tone.Synth({
				oscillator: {
					type: "amtriangle",
					harmonicity: 0.5,
					modulationType: "sine",
				},
				envelope: {
					attackCurve: "exponential",
					attack: 0.05,
					decay: 0.2,
					sustain: 0.2,
					release: 1.5,
				},
				portamento: 0.05,
			}).toDestination();
		</script>

		<script>
			piano(synth);
			ui(synth);
		</script>
	</body>
</html>
