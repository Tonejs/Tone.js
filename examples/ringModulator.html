<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Ring Modulator</title>

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="174x174"
			href="./favicon.png"
		/>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/webcomponentsjs/2.4.3/webcomponents-bundle.js"></script>
		<link
			href="https://fonts.googleapis.com/css?family=Material+Icons&display=block"
			rel="stylesheet"
		/>
		<script src="../build/Tone.js"></script>
		<script src="./js/tone-ui.js"></script>
		<script src="./js/components.js"></script>
	</head>
	<body>
		<tone-example label="Ring Modulator">
			<tone-loader></tone-loader>

			<div slot="explanation">
				The <a href="https://tonejs.github.io/docs/latest/classes/RingModulator"
					>Tone.RingModulator</a> multiplies the input by a carrier oscillator. Instead of the notes you play, you hear the sum and difference of each note's frequency and the carrier's frequency, which gives a metallic, bell-like sound. Change the carrier frequency and type to hear how the sound changes.
			</div>

			<div id="content"></div>
		</tone-example>

		<script type="text/javascript">
			const ringModulator = new Tone.RingModulator().toDestination();

			const synth = new Tone.Synth().connect(ringModulator);

			piano({
				parent: document.querySelector("#content"),
				polyphonic: true,
				noteon: (note) => synth.triggerAttack(note.name),
				noteoff: (note) => synth.triggerRelease(),
			});

			ui({
				tone: ringModulator,
				parent: document.querySelector("#content"),
			});
		</script>
	</body>
</html>
