<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Pitch Shift</title>
		<script src="./js/tone-ui.js"></script>
	</head>
	<body>
		<tone-example>
			<div slot="explanation">
				This example demonstrates the Pitch Shift effect.
				<br /><br />
				<a
					href="https://tonejs.github.io/docs/latest/classes/PitchShift"
					>Tone.Pitch Shift</a
				>
				docs.
			</div>

			<tone-play-toggle></tone-play-toggle>
			<tone-slider
				label="pitch"
				min="-12"
				max="12"
				value="0"
				units="hz"
			></tone-slider>
		</tone-example>

		<script data-tone-code>
			const pitchShift = new Tone.PitchShift().toDestination();
			const player = new Tone.Player(
				"https://tonejs.github.io/audio/berklee/groovin_analogsynth1.mp3"
			).connect(pitchShift);
			player.loop = true;

			const toneFFT = new Tone.FFT();
			pitchShift.connect(toneFFT);
		</script>

		<script>
			fft(toneFFT);
			bind("tone-play-toggle", player);
			bind("tone-slider", (pitch) => (pitchShift.pitch = pitch));
		</script>
	</body>
</html>
