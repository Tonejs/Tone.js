name: Tests

on:
    pull_request:
        types: [opened, reopened, synchronize]
        branches:
            - dev
            - main
    push:
        branches:
            - dev
            - main

jobs:
    test-conventional-commit:
        name: Validate PR title
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # only on PRs
              if: github.event_name == 'pull_request'
    run-tests:
        name: All tests
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [test-conventional-commit]
        env:
            BROWSER: chrome
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: "npm"
            - name: Install dependencies
              run: npm install
            - name: All tests
              run: npm run test
            - name: Upload coverage
              uses: codecov/codecov-action@v5
              with:
                  fail_ci_if_error: false
                  codecov_yml_path: ./.github/codecov.yml
                  token: ${{ secrets.CODECOV_TOKEN }}
    test-code-examples:
        name: Check typedocs
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [test-conventional-commit]
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: "npm"
            - name: Install dependencies
              run: npm install
            - name: Build Docs
              run: npm run build && npm run docs:json
            - name: tsdoc @example checks
              run: npm run test:examples
    test-html-examples:
        name: Run HTML Examples
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [test-conventional-commit]
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: "npm"
            - name: Install dependencies
              run: npm install
            - name: Build
              run: npm run build
            - name: Code example tests
              run: npm run test:html
    test-lint:
        name: Linting and environment checks
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [test-conventional-commit]
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: "npm"
            - name: Install dependencies
              run: npm install
            - name: Linting
              run: npm run lint
            - name: Spell check
              run: npm run spellcheck
    test-readme:
        name: Ensure that examples in the README compile
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [test-conventional-commit]
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: "npm"
            - name: Install dependencies
              run: npm install
            - name: Build
              run: npm run build
            - name: Test
              run: npm run test:readme
    test-integrations:
        name: Test integrations
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [test-conventional-commit]
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: "npm"
            - name: Install dependencies
              run: npm install
            - name: Build
              run: npm run build
            - name: Test
              run: npm run test:integrations
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        # make sure all the tests pass first
        needs:
            [
                run-tests,
                test-code-examples,
                test-html-examples,
                test-lint,
                test-readme,
                test-integrations,
            ]
        # not on PRs
        if: github.event_name != 'pull_request'
        env:
            GITHUB_CI: true
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
            # Need to unset this in order to use OICD
            - name: Unset NODE_AUTH_TOKEN
              run: unset NODE_AUTH_TOKEN
            - name: Install dependencies
              run: npm install
            - name: Build
              run: npm run build
            - name: Increment version
              run: npm run increment
            - name: Publish @next
              # dev branch gets published with @next tag
              run: npm publish --tag next --provenance --access public
              if: ${{ github.ref == 'refs/heads/dev' }}
            - name: Publish @latest
              # main branch gets published with @latest tag
              run: npm publish --provenance --access public
              if: ${{ github.ref == 'refs/heads/main' }}
